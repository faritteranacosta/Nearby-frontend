<!-- Create Property Modal -->
<div class="modal" id="createPropertyModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Publicar Nueva Propiedad</h3>
            <button class="close-btn" onclick="closeModal('createPropertyModal')">&times;</button>
        </div>
        <div class="modal-body">
            <form id="createPropertyForm" onsubmit="handleCreateProperty(event)">
                <div class="form-group">
                    <label>Título</label>
                    <input type="text" class="form-control" name="title" required
                        placeholder="Ej: Apartamento cerca del campus">
                </div>

                <div class="form-group">
                    <label>Descripción</label>
                    <textarea class="form-control" name="description" required
                        placeholder="Describe tu propiedad..."></textarea>
                </div>

                <div class="form-group">
                    <label>Dirección</label>
                    <input type="text" class="form-control" name="address" required placeholder="Calle 123 #45-67">
                </div>

                <div class="form-group">
                    <label>Barrio</label>
                    <input type="text" class="form-control" name="neighborhood" placeholder="Ej: Centro, Mamatoco">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Tipo de Propiedad</label>
                        <select class="form-control" name="property_type" required>
                            <option value="">Seleccionar...</option>
                            <option value="apartment">Apartamento</option>
                            <option value="house">Casa</option>
                            <option value="room">Habitación</option>
                            <option value="studio">Estudio</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Precio Mensual (COP)</label>
                        <input type="number" class="form-control" name="price" required placeholder="500000">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Habitaciones</label>
                        <input type="number" class="form-control" name="bedrooms" min="0" placeholder="2">
                    </div>

                    <div class="form-group">
                        <label>Baños</label>
                        <input type="number" class="form-control" name="bathrooms" min="0" step="0.5" placeholder="1">
                    </div>

                    <div class="form-group">
                        <label>Área (m²)</label>
                        <input type="number" class="form-control" name="area_sqm" min="0" placeholder="50">
                    </div>
                </div>

                <div class="form-group">
                    <label>Amenidades (separadas por coma)</label>
                    <input type="text" class="form-control" name="amenities"
                        placeholder="WiFi, Cocina, Lavadora, Aire acondicionado">
                </div>

                <div class="form-group">
                    <label>Imágenes</label>
                    <input type="file" class="form-control" name="images" multiple accept="image/*" id="propertyImages">
                    <small style="color: var(--text-muted);">Puedes seleccionar hasta 10 imágenes</small>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Publicar
                    Propiedad</button>
            </form>
        </div>
    </div>
</div>
