<!-- Login Modal -->
<div class="modal" id="loginModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Iniciar Sesión</h3>
            <button class="close-btn" onclick="closeModal('loginModal')">&times;</button>
        </div>
        <div class="modal-body">
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" class="form-control" name="email" required placeholder="tu@email.com">
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" class="form-control" name="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Iniciar Sesión</button>
            </form>
            <p class="text-center mt-2" style="color: var(--text-muted);">
                ¿No tienes cuenta? <a href="#" onclick="closeModal('loginModal'); openModal('registerModal')"
                    style="color: var(--primary-purple-light);">Regístrate aquí</a>
            </p>
        </div>
    </div>
</div>
