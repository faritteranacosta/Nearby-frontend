<!-- Review Modal -->
<div class="modal" id="reviewModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Dejar Reseña</h3>
            <button class="close-btn" onclick="closeModal('reviewModal')">&times;</button>
        </div>
        <div class="modal-body">
            <form id="reviewForm" onsubmit="handleSubmitReview(event)">
                <input type="hidden" id="reviewPropertyId" name="property_id">

                <div class="form-group">
                    <label>Calificación</label>
                    <div class="star-rating" id="starRating">
                        <span class="star" data-rating="1">★</span>
                        <span class="star" data-rating="2">★</span>
                        <span class="star" data-rating="3">★</span>
                        <span class="star" data-rating="4">★</span>
                        <span class="star" data-rating="5">★</span>
                    </div>
                    <input type="hidden" id="ratingValue" name="rating" required>
                </div>

                <div class="form-group">
                    <label>Comentario (opcional)</label>
                    <textarea class="form-control" name="comment" placeholder="Comparte tu experiencia..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Publicar Reseña</button>
            </form>
        </div>
    </div>
</div>
