<!-- Chat Section -->
<section class="properties-section hidden" id="chatSection">
    <div class="container">
        <div class="section-header">
            <h2><i class="fas fa-comments"></i> Mensajes</h2>
            <p>Conversaciones con propietarios y estudiantes</p>
        </div>

        <div style="display: grid; grid-template-columns: 300px 1fr; gap: var(--spacing-lg); min-height: 600px;">
            <!-- Chat Rooms List -->
            <div class="glass-card" style="padding: var(--spacing-md); overflow-y: auto;">
                <h4 style="margin-bottom: var(--spacing-md);">Conversaciones</h4>
                <div id="chatRoomsList">
                    <div class="spinner"></div>
                </div>
            </div>

            <!-- Chat Messages -->
            <div class="glass-card" style="padding: 0; display: flex; flex-direction: column;">
                <div id="chatHeader"
                    style="padding: var(--spacing-md); border-bottom: 1px solid rgba(139, 92, 246, 0.2);">
                    <p style="color: var(--text-muted);">Selecciona una conversación</p>
                </div>
                <div id="chatMessages"
                    style="flex: 1; padding: var(--spacing-md); overflow-y: auto; max-height: 450px;">
                    <!-- Messages will appear here -->
                </div>
                <div id="chatInput" class="hidden"
                    style="padding: var(--spacing-md); border-top: 1px solid rgba(139, 92, 246, 0.2);">
                    <div style="display: flex; gap: var(--spacing-sm);">
                        <input type="text" id="messageInput" class="form-control" placeholder="Escribe un mensaje..."
                            onkeypress="handleMessageKeyPress(event)">
                        <button class="btn btn-primary" onclick="sendChatMessage()">Enviar</button>
                    </div>
                    <div id="typingIndicator" class="hidden"
                        style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0.5rem;">
                        <em>Escribiendo...</em>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
