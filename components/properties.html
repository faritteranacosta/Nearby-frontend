<!-- Properties Section -->
<section class="properties-section hidden" id="propertiesSection">
    <div class="container">
        <div class="section-header">
            <h2>Alojamientos Disponibles</h2>
            <p>Encuentra tu hogar ideal cerca del campus</p>
        </div>

        <!-- Filters -->
        <div class="filters">
            <select class="filter-btn" id="filterType" onchange="applyFilters()">
                <option value="">Todos los tipos</option>
                <option value="apartment">Apartamento</option>
                <option value="house">Casa</option>
                <option value="room">Habitación</option>
                <option value="studio">Estudio</option>
            </select>

            <select class="filter-btn" id="filterBedrooms" onchange="applyFilters()">
                <option value="">Habitaciones</option>
                <option value="1">1+</option>
                <option value="2">2+</option>
                <option value="3">3+</option>
            </select>

            <select class="filter-btn" id="filterPrice" onchange="applyFilters()">
                <option value="">Precio</option>
                <option value="0-500000">Hasta $500,000</option>
                <option value="500000-1000000">$500,000 - $1,000,000</option>
                <option value="1000000-1500000">$1,000,000 - $1,500,000</option>
                <option value="1500000-999999999">Más de $1,500,000</option>
            </select>

            <input type="text" class="filter-btn" id="filterSearch" placeholder="Buscar..." onkeyup="applyFilters()"
                style="min-width: 200px;">
        </div>

        <!-- Properties Grid -->
        <div class="properties-grid" id="propertiesGrid">
            <div class="spinner"></div>
        </div>
    </div>
</section>

<!-- Favorites Section -->
<section class="properties-section hidden" id="favoritesSection">
    <div class="container">
        <div class="section-header">
            <h2>Mis Favoritos</h2>
            <p>Propiedades que has guardado</p>
        </div>

        <div class="properties-grid" id="favoritesGrid">
            <div class="spinner"></div>
        </div>
    </div>
</section>

<!-- My Properties Section (Owner Only) -->
<section class="properties-section hidden" id="myPropertiesSection">
    <div class="container">
        <div class="section-header">
            <h2>Mis Propiedades</h2>
            <p>Gestiona tus publicaciones</p>
            <button class="btn btn-primary" onclick="openModal('createPropertyModal')">
                + Nueva Propiedad
            </button>
        </div>

        <div class="properties-grid" id="myPropertiesGrid">
            <div class="spinner"></div>
        </div>
    </div>
</section>
